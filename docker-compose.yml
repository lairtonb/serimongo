services:
  serimongo:
    build: .
    image: serimongo:local
    ports:
      - "51983:8080"
    environment:
      ApplicationOptions__Database__ConnectionString: "Data Source=/data/serimongo.db"
      ApplicationOptions__Seed__Enabled: "true"
      ApplicationOptions__Seed__ScriptPath: "/app/seed.sql"
    volumes:
      - serimongo-data:/data

  simulator:
    build:
      context: .
      dockerfile: Simulator/SeriMongo.Simulator/Dockerfile
    image: serimongo-simulator:local
    ports:
      - "51984:8080"
    environment:
      SimulatorOptions__TargetBaseUrl: "http://serimongo:8080"
    depends_on:
      - serimongo

volumes:
  serimongo-data:
